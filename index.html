<section id="loginPage" class="hidden">
  <div class="card login">
    <h2>🔐 หลังบ้านผู้ดูแล</h2>
    <p class="privacy">สำหรับครู/ผู้ดูแลที่ได้รับอนุญาตเท่านั้น</p>
    <!-- นำเข้า Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-browser@2"></script>

<script>
// ใส่ URL และ Key ที่คัดลอกจากข้อ 1
const SUPABASE_URL = https://boycilknwscfbqawhxfr.supabase.co;
const SUPABASE_KEY = sb_publishable_zGm9gZGZ-e20huzHlVydAg_jOV58FGQ;
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = x => document.getElementById(x);
let images = [];

files.onchange = async e => {
  images = [];
  for (const f of e.target.files) images.push(await read(f));
  preview.innerHTML = images.map(i => `<img src="${i}">`).join("");
};

function read(f) {
  return new Promise(r => {
    const x = new FileReader();
    x.onload = () => r(x.result);
    x.readAsDataURL(f);
  });
}

function showAdmin() {
  reportPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
  adminPage.classList.add("hidden");
}

// 1. ส่งข้อมูลจากอุปกรณ์ใดก็ได้ เข้า Cloud Database
form.onsubmit = async e => {
  e.preventDefault();
  
  const payload = {
    type: type.value,
    date: date.value,
    place: place.value,
    message: message.value,
    person: person.value,
    imgs: images,
    status: "รอตรวจสอบ"
  };

  const { error } = await supabase.from('reports').insert([payload]);

  if (error) {
    alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + error.message);
    return;
  }

  form.reset();
  images = [];
  preview.innerHTML = "";
  success.classList.remove("hidden");
  setTimeout(() => success.classList.add("hidden"), 5000);
};

// 2. ล็อกอินด้วย Email & Password ของผู้ตรวจแต่ละคน
async function login() {
  const email = $("userEmail").value;
  const password = $("pass").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
  } else {
    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");
    render();
  }
}

async function logout() {
  await supabase.auth.signOut();
  adminPage.classList.add("hidden");
  reportPage.classList.remove("hidden");
}

// 3. ดึงรายการข้อมูลกลางมาแสดง
async function render() {
  let { data: reports, error } = await supabase
    .from('reports')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    alert("ไม่สามารถดึงข้อมูลได้: " + error.message);
    return;
  }

  let q = search.value.toLowerCase();
  let f = filter.value;
  let r = reports.filter(x => 
    (!q || (x.type + x.place + x.message + (x.person || '')).toLowerCase().includes(q)) &&
    (!f || x.status === f)
  );

  total.textContent = reports.length;
  pending.textContent = reports.filter(x => x.status === "รอตรวจสอบ").length;
  checked.textContent = reports.filter(x => x.status === "ตรวจสอบแล้ว").length;

  tbody.innerHTML = r.length ? r.map(x => `
    <tr>
      <td>${new Date(x.created_at).toLocaleString("th-TH")}</td>
      <td>${esc(x.type)}<br><span class="small">${esc(x.place)}</span></td>
      <td style="white-space:normal;min-width:230px">${esc(x.message)}</td>
      <td>${esc(x.person || "ไม่ได้ระบุ")}</td>
      <td>${x.imgs?.length ? x.imgs.map(i => `<img class="thumb" src="${i}">`).join("") : "—"}</td>
      <td><span class="badge ${x.status === "ตรวจสอบแล้ว" ? "done" : x.status === "ไม่พบการกระทำผิด" ? "reject" : ""}">${x.status}</span></td>
      <td>
        <select onchange="st(${x.id}, this.value)">
          <option ${x.status === 'รอตรวจสอบ' ? 'selected' : ''}>รอตรวจสอบ</option>
          <option ${x.status === 'กำลังตรวจสอบ' ? 'selected' : ''}>กำลังตรวจสอบ</option>
          <option ${x.status === 'ตรวจสอบแล้ว' ? 'selected' : ''}>ตรวจสอบแล้ว</option>
          <option ${x.status === 'ไม่พบการกระทำผิด' ? 'selected' : ''}>ไม่พบการกระทำผิด</option>
        </select>
        <button class="btn danger" onclick="del(${x.id})">ลบ</button>
      </td>
    </tr>
  `).join("") : `<tr><td colspan="7" style="text-align:center;padding:35px;color:#667085">ยังไม่มีรายงาน</td></tr>`;
}

// 4. อัปเดตสถานะ หรือ ลบรายการ
async function st(id, s) {
  const { error } = await supabase.from('reports').update({ status: s }).eq('id', id);
  if (!error) render();
}

async function del(id) {
  if (confirm("ลบรายงานนี้หรือไม่?")) {
    const { error } = await supabase.from('reports').delete().eq('id', id);
    if (!error) render();
  }
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
}
</script>
    <!-- เพิ่มช่องกรอก อีเมล -->
    <label>อีเมลผู้ดูแล</label>
    <input id="userEmail" type="email" placeholder="เช่น teacher@school.com">
    
    <label style="margin-top:10px">รหัสผ่าน</label>
    <input id="pass" type="password" placeholder="กรอกรหัสผ่าน">
    
    <div class="actions">
      <button class="btn primary" onclick="login()">เข้าสู่ระบบ</button>
    </div>
  </div>
</section>
