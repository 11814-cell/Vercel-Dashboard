<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งเหตุและจัดการข้อมูลโรงเรียน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Navbar Navigation -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-slate-800 text-lg">
      <span class="p-2 bg-red-100 text-red-600 rounded-lg">📢</span>
      ระบบแจ้งเหตุโรงเรียน
    </div>
    <div id="navButtons">
      <button onclick="showView('loginView')" id="teacherLoginNavBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition">
        🔑 คุณครูเข้าสู่ระบบ
      </button>
      <div id="userMenu" class="hidden flex items-center gap-3">
        <span id="userEmail" class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full"></span>
        <button onclick="logoutTeacher()" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-semibold transition">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- Section 1: ฟอร์มสำหรับนักเรียน (Default View) -->
    <div id="studentView" class="max-w-lg mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 my-6">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">แจ้งเหตุ / พฤติกรรมไม่เหมาะสม</h1>
        <p class="text-slate-500 text-sm mt-1">ข้อมูลจะถูกส่งถึงคุณครูโดยตรงและปลอดภัย</p>
      </div>

      <form id="reportForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">หัวข้อเรื่อง <span class="text-red-500">*</span></label>
          <input type="text" id="topic" required placeholder="เช่น การบูลลี่, การทำลายทรัพย์สิน" 
                 class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">รายละเอียด <span class="text-red-500">*</span></label>
          <textarea id="detail" rows="4" required placeholder="ระบุสถานที่ วัน เวลา..." 
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">รูปภาพหลักฐาน <span class="text-red-500">*</span></label>
          <input type="file" id="imageFile" accept="image/*" required class="w-full text-sm text-slate-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้แจ้ง <span class="text-slate-400 font-normal">(ไม่ระบุก็ได้)</span></label>
          <input type="text" id="reporter" placeholder="ไม่ระบุตัวตน" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
        </div>
        <button type="submit" id="submitBtn" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow transition">
          ส่งข้อมูลให้คุณครู
        </button>
      </form>
    </div>

    <!-- Section 2: ฟอร์มเข้าสู่ระบบสำหรับคุณครู -->
    <div id="loginView" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 my-10">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบสำหรับคุณครู</h2>
        <p class="text-slate-500 text-xs mt-1">กรอกอีเมลและรหัสผ่านที่คุณครูลงทะเบียนไว้</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">อีเมลคุณครู</label>
          <input type="email" id="teacherEmail" required placeholder="teacher@school.ac.th" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
          <input type="password" id="teacherPassword" required placeholder="••••••••" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
        </div>
        <button type="submit" id="loginBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-lg transition">
          เข้าสู่ระบบ
        </button>
        <button type="button" onclick="showView('studentView')" class="w-full py-2 text-slate-500 hover:text-slate-800 text-sm">
          ← กลับหน้าแจ้งเหตุ
        </button>
      </form>
    </div>

    <!-- Section 3: แดชบอร์ดดูข้อมูล (เฉพาะคุณครูที่ล็อกอินแล้ว) -->
    <div id="adminView" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <div>
          <h2 class="text-xl font-bold text-slate-800">แดชบอร์ดจัดการเรื่องแจ้งเหตุ</h2>
          <p class="text-xs text-slate-500">ข้อมูลทั้งหมดจะเข้าถึงได้เฉพาะบัญชีคุณครูเท่านั้น</p>
        </div>
        <div class="flex gap-2">
          <button onclick="showView('studentView')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">ดูหน้าฟอร์มส่ง</button>
          <button onclick="fetchReports()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg">🔄 รีเฟรชข้อมูล</button>
        </div>
      </div>
      <div id="reportsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

  </main>

  <script>
    // 1. ตั้งค่า Supabase API Key
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. ตรวจสอบสถานะการล็อกอินเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      updateAuthUI(session);
    });

    function updateAuthUI(session) {
      if (session) {
        document.getElementById('teacherLoginNavBtn').classList.add('hidden');
        document.getElementById('userMenu').classList.remove('hidden');
        document.getElementById('userEmail').innerText = session.user.email;
        showView('adminView');
        fetchReports();
      } else {
        document.getElementById('teacherLoginNavBtn').classList.remove('hidden');
        document.getElementById('userMenu').classList.add('hidden');
        showView('studentView');
      }
    }

    // สลับการแสดงผลหน้าต่างๆ
    function showView(viewId) {
      ['studentView', 'loginView', 'adminView'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    // 3. ระบบล็อกอินสำหรับคุณครู
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('teacherEmail').value;
      const password = document.getElementById('teacherPassword').value;
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
      } else {
        updateAuthUI(data.session);
      }
    });

    // ออกจากระบบ
    async function logoutTeacher() {
      await supabaseClient.auth.signOut();
      updateAuthUI(null);
    }

    // 4. ระบบส่งข้อมูลของนักเรียน
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่งข้อมูล...";

      try {
        const topic = document.getElementById('topic').value;
        const detail = document.getElementById('detail').value;
        const reporter = document.getElementById('reporter').value || "ไม่ระบุตัวตน";
        const file = document.getElementById('imageFile').files[0];

        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `reports/${fileName}`;

        const { error: uploadError } = await supabaseClient.storage.from('report-images').upload(filePath, file);
        if (uploadError) throw uploadError;

        const { data: urlData } = supabaseClient.storage.from('report-images').getPublicUrl(filePath);

        const { error: insertError } = await supabaseClient.from('reports').insert([
          { topic, detail, reporter, image_url: urlData.publicUrl }
        ]);
        if (insertError) throw insertError;

        alert("ส่งข้อมูลเรียบร้อยแล้ว");
        document.getElementById('reportForm').reset();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "ส่งข้อมูลให้คุณครู";
      }
    });

    // 5. ดึงข้อมูลรายงานมาแสดง (เข้าถึงได้เมื่อล็อกอิน)
    async function fetchReports() {
      const container = document.getElementById('reportsList');
      container.innerHTML = `<p class="col-span-full text-center text-slate-400">กำลังโหลด...</p>`;

      const { data, error } = await supabaseClient.from('reports').select('*').order('created_at', { ascending: false });
      if (error) {
        container.innerHTML = `<p class="col-span-full text-center text-red-500">เกิดข้อผิดพลาด</p>`;
        return;
      }

      if (data.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-400">ยังไม่มีข้อมูลการแจ้งเหตุ</p>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
          <div>
            <img src="${item.image_url}" class="h-48 w-full object-cover">
            <div class="p-4">
              <span class="text-xs text-slate-400">${new Date(item.created_at).toLocaleString('th-TH')}</span>
              <h3 class="font-bold text-slate-800 text-lg mt-1">${escapeHtml(item.topic)}</h3>
              <p class="text-sm text-slate-600 mt-2 whitespace-pre-line">${escapeHtml(item.detail)}</p>
            </div>
          </div>
          <div class="p-4 pt-0 flex justify-between items-center text-xs text-slate-500 border-t border-slate-50 mt-2">
            <span>ผู้แจ้ง: <strong>${escapeHtml(item.reporter)}</strong></span>
            <a href="${item.image_url}" target="_blank" class="text-red-600 font-semibold hover:underline">🔍 ดูรูปใหญ่</a>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
